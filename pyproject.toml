[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pyomo-studio"
version = "1.0.0"
description = "Fluent 2 desktop workbench for Pyomo models with stochastic programming and ISA-101 schedules"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyomo>=6.7", "highspy>=1.7", "PySide6>=6.6"]

[project.scripts]
pyomo-studio = "pyomo_studio.__main__:main"

[tool.setuptools.packages.find]
include = ["pyomo_studio*"]

[tool.setuptools.package-data]
pyomo_studio = ["examples/*.json", "docs/*.md"]
